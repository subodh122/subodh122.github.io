# About Section
about_title: About me title (Use this to override about section title)
about_profile_image: _test/images/travis.png
about_content: > # this means to ignore newlines until the next config item.
  Write an awesome description about yourself here, this supports markdown, so you can add [links](http://foobar.com) and highlight things <mark>like this</mark>.

  You can even add paragraphs by using empty lines like this and add anything else markdown supports.

# Content sections
content:
  - title: Experience
    layout: list
    content:
      - layout: right
        title: Company 1
        link: https://google.com
        sub_title: Job title 1
        caption: November 2016 - present
        quote: >
          Short description of the company (optional)
        description: >
          Description of role

      - layout: top
        title: Company 2
        sub_title: Job title 1
        caption: January 2014 - November 2016
        description: >
          Description of role

  - title: Education
    layout: list
    content:
      - title: Institution 1
        sub_title: 2016 - 2019
        caption: Degree
        quote: >
          Short institution or course description
        description: >
          Description of qualification

  - title: A Little More About Me
    layout: text
    content: |
      This is where you can write a little more about yourself. You could title this section **Interests** and include some of your other interests.

      Or you could title it **Skills** and write a bit more about things that make you more desirable, like *leadership* or *teamwork*

# Projects Section
projects_title: Projects title #(Use this to override about projects section title)

# Experience Section
experience_title: Experience title #(Use this to override about experience section title)

# Education Section
educaton_title: Education title #(Use this to override about education section title)

# More Section
# more_title: A Little More About Me #(Use this to override about more section title)
more_content: > # this means to ignore newlines until the next config item.
  This is where you can write a little more about yourself. You could title this section **Interests** and include some of your other interests. Or you could title it **Skills**
  and write a bit more about things that make you more desirable, like *leadership* or *teamwork*

# Footer
footer_show_references: true

# Build settings
remote_theme: sproogen/modern-resume-theme

data_dir: _test/_data

include:
 - _test

exclude:
  - vendor
  - backup
  - subodh-cv.pdf
  - subodh-photo.jpg
  - Subodh_Sonar_CV.pdf
  - IMG-20250129-WA0043~3.jpg

sass:
  sass_dir: _sass
  style: compressed

plugins:
 - jekyll-remote-theme
 - jekyll-seo-tag
