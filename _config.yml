# More Section
more_title: Professional Experience & Research
more_content: |
  **Automation Experience:**
  
  **10x Genomics | Hamilton STAR, STARlet, Vantage**
  • Scripted methods for scaled-down oligo-ligation chemistry with modular functions for R&D
  • Implemented custom tip adapter and pickup pattern to achieve barcode diversity
  • Optimized liquid class for viscous gel-bead solutions in aqueous buffers, saving 8 hours per iteration
  • Assisted in automating manual dispensing processes, creating SOPs, conducting FMEA, and ensuring QC sampling
  • Designed and executed cross-contamination study for automated dispensing in next-gen Xenium plates

  **BD Biosciences | ML apps, Opentrons**
  • Developed ML app for predicting functional group exchange reactions, achieving 4% mean squared error
  • Modeled using SVM, XgBoost and RF Regressors, deployed using Gradio
  • Saved 16 hours of R&D per screening run and reduced QC testing load

  ---

  **Research Experience:**
  
  **Graduate Researcher, University of California San Diego (2018-2019)**
  • Conducted interdisciplinary research in advanced materials as part of MURI-funded project
  • Focused on polydopamine nanoparticle synthesis, mixed-matrix membranes, and bio-inspired chemical systems
  • Achieved high absorptive thin films for solar energy applications
  • ECE136L: Fabricated diodes, LEDs, MOS capacitors, and FETs via photolithography and thin-film deposition
  • ECE202: Conducted characterization of implantable sensing electrodes, designed EEG/EMG arrays using CAD

  **Undergraduate Researcher, Institute of Chemical Technology (2016-2017)**
  • Designed, synthesized and analyzed Cerium and Zirconium-based MOFs (UiO-66/808) and APTES-functionalized MCM-41 catalysts
  • Achieved >90% conversions in 30+ catalytic reactions such as transamination, formylation and CO₂ cycloaddition

  **Summer Researcher, Department of Chemical Engineering, IIT Bombay (2015)**
  • Assessed small molecule recovery from polymeric by-products (Asphaltenes) of refined crude oil
  • Estimated molecular weight through osmolality measurements and HPTLC analysis
  • Classified macromolecule constituents and identified separable organic compounds using polarity-based solvent mixtures

  ---

  **Additional Information:**
  
  **Volunteer Experience:**
  • Green Trails Volunteer at Indiahikes (2017-Present): Participated in Green Trails activity in Jiskun, Himachal Pradesh
  • Awarded Green Trekker certificate for maximum contribution towards waste collection and segregation on Rupin Pass trail
  • Event Head at ManZar ICT (2015-2016): Brought music partners and secured INR 100,000 in prize money sponsorship

  **Languages:** English (Fluent), Hindi (Native), Marathi (Native)

  **Interests:** Process optimization, automation, sustainable technology, hiking, environmental conservation

